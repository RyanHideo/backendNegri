# Keep disabled until the PLC tag name and address are known.
truckflow.enabled=false
truckflow.ccm=ccm1

# One-tag mode: fill state-tag. The values can be changed if the PLC uses another convention.
truckflow.state-tag=
truckflow.red-value=0
truckflow.green-value=1

# Two-tag mode: keep state-tag empty and fill both tags below.
# In this mode, any non-zero value means that the respective light is active.
truckflow.red-tag=
truckflow.green-tag=

truckflow.poll-ms=1000
truckflow.state-file=data/truck_count.properties
