# Mantenha desativado ate conhecer os nomes e enderecos das duas tags no CLP.
truckflow.enabled=false

# Bit que seleciona a cor enquanto o semaforo esta ligado.
# 0 = vermelho, 1 = verde.
truckflow.color-tag=
truckflow.red-value=0
truckflow.green-value=1

# Bit que liga ou desliga o semaforo.
# 0 = desligado, 1 = ligado.
truckflow.power-tag=
truckflow.power-off-value=0
truckflow.power-on-value=1

truckflow.poll-ms=1000
truckflow.state-file=data/truck_count.properties
