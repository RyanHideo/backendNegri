tags:
  # ========================
  # COMANDOS / SEGURANÇA (Coils 1..2)
  # ========================
  - name: EMERGENCIA
    type: COIL
    address: 1
    writable: true
    readable: false   # não ler
    polled: false     # não entrar no polling
    description: "Ativa a emergência (retentivo até reset)"

  - name: RESET
    type: COIL
    address: 2
    writable: true
    readable: false   # não ler
    polled: false     # não entrar no polling
    description: "Pulso de reset global"

  # ========================
  # CICLO (mapeado na tela como Ton_1_IN e Ton_1_Q) - Coils 3..4
  # ========================
  - name: ciclo_iniciar
    type: COIL
    address: 3
    writable: false
    readable: true
    polled: true
    description: "Entrada para iniciar ciclo (UserPrg.Ton_1_IN)"

  - name: ciclo_finalizado
    type: COIL
    address: 4
    writable: false
    readable: true
    polled: true
    description: "Saída do temporizador do ciclo (UserPrg.Ton_1_Q)"

  # ========================
  # ESTADOS DE MOTORES (Coils 5..8)
  # ========================
  - name: motor_1_run
    type: COIL
    address: 5
    writable: false
    readable: true
    polled: true
    description: "Saída motor 1"

  - name: motor_1_fault
    type: COIL
    address: 6
    writable: false
    readable: true
    polled: true
    description: "Falha motor 1"

  - name: motor_2_run
    type: COIL
    address: 7
    writable: false
    readable: true
    polled: true
    description: "Saída motor 2"

  - name: motor_2_fault
    type: COIL
    address: 8
    writable: false
    readable: true
    polled: true
    description: "Falha motor 2"

  # FEEDBACK (LEITURA) — ESTADO DA PARADA
  - name: emergencia_fb
    type: COIL
    address: 9
    writable: false
    readable: true
    polled: true
    description: "Feedback da emergência/parada: 1 = latched no CLP"

  # EQUIPAMENTO DE OZÔNIO (somente leitura)
  - name: ozonio_equipamento
    type: COIL
    address: 10
    writable: false
    readable: true
    polled: true
    description: "Status do equipamento de ozônio (1 = ligado, 0 = desligado)"

  # ========================
  # NÍVEIS DE TANQUES (HR 4001..4003) — 1 word (16 bits)
  # ========================
  - name: nivel_tanque_1
    type: HR
    address: 4001
    words: 1
    format: U16
    writable: false
    readable: true
    polled: true
    scale: 1.0
    description: "Nível do tanque 1 (%)"

  - name: nivel_tanque_2
    type: HR
    address: 4002
    words: 1
    format: U16
    writable: false
    readable: true
    polled: true
    scale: 1.0
    description: "Nível do tanque 2 (%)"

  - name: nivel_tanque_3
    type: HR
    address: 4003
    words: 1
    format: U16
    writable: false
    readable: true
    polled: true
    scale: 1.0
    description: "Nível do tanque 3 (%)"

  # ========================
  # MULTIMEDIDOR (14 leituras) – HR 4004..4017 — 1 word (16 bits)
  # ========================
  - name: multimedidor_1
    type: HR
    address: 4004
    words: 1
    format: U16
    writable: false
    readable: true
    polled: true
    scale: 1.0
    description: "MultTCP[0]"

  - name: multimedidor_2
    type: HR
    address: 4005
    words: 1
    format: U16
    writable: false
    readable: true
    polled: true
    scale: 1.0
    description: "MultTCP[1]"

  - name: multimedidor_3
