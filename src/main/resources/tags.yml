tags:
  # COMANDOS / SEGURANÇA
  - name: parada
    type: COIL
    address: 1
    writable: true
    description: "Parada retentiva: liga com ON e permanece até enviar OFF (ou clicar novamente em TOGGLE)"

  - name: reset
    type: COIL
    address: 2
    writable: true
    description: "Pulso de reset não-retentivo"

  # CICLO 12 HORAS
  - name: ciclo_iniciar
    type: COIL
    address: 3
    writable: true
    description: "Comando para iniciar o ciclo de 12h"

  - name: ciclo_finalizado
    type: COIL
    address: 4
    writable: false
    description: "Bit de ciclo concluído"

  - name: ciclo_interrompido
    type: COIL
    address: 5
    writable: false
    description: "Bit de ciclo interrompido por falha ou parada"

  # ESTADOS DE MOTORES
  - name: bomba_1_run
    type: COIL
    address: 10
    writable: false
    description: "Status de funcionamento da bomba principal"

  - name: bomba_1_fault
    type: COIL
    address: 11
    writable: false
    description: "Falha da bomba principal"

  - name: bomba_2_run
    type: COIL
    address: 12
    writable: false
    description: "Status de funcionamento da bomba secundária"

  - name: bomba_2_fault
    type: COIL
    address: 13
    writable: false
    description: "Falha da bomba secundária"

  # SENSORES / MEDIÇÕES
  - name: nivel_tanque_efluente
    type: HR
    address: 4001
    writable: false
    description: "Nível do tanque da efluente(%)"

  - name: nivel_tanque_tratamento
    type: HR
    address: 4003
    writable: false
    description: "Nível do tanque de tratamento(%)"

  - name: ozonio_ppm
    type: HR
    address: 4005
    writable: false
    description: "Nível do tanque de evaporação(%)"
