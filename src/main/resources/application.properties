server.port=9090

# Habilita o modo de simulacao do ModbusService.
# Quando true, o servico nao tenta conectar ao CLP real.
modbus.simulation.enabled=false

# Um unico CLP fisico atende ao catalogo do CCM.
modbus.host=192.168.0.185
modbus.port=502

# Estrutura opcional para a potência percentual do britador primário.
# Mantenha desativada e sem tag até o endereço real ser confirmado.
auxiliary.primary-crusher.enabled=false
auxiliary.primary-crusher.power-percent-tag=

# O CLP envia 0..1000 (0,0%..100,0%) para cada potência de 150 kW do VSI.
vsi.power.kw-to-kva-factor=1.25
vsi.power.kva-to-kw-factor=0.8
vsi.power.maximum-kw=150
vsi.power.raw-full-scale=1000
