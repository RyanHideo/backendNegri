# Define a porta do servidor web para 8081 para evitar conflitos com a porta 8080
server.port=9090

# Habilita o modo de simulação do ModbusService
# Quando 'true', o serviço não tentará se conectar a CLPs reais
# e, em vez disso, gerará dados de tag aleatórios para teste.
modbus.simulation.enabled=false

# Configurações de host (ignoradas se a simulação estiver ativada)
modbus.ccm1.host=192.168.100.103
modbus.ccm2.host=192.168.100.104
